<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERTEX — Puntos Pulsantes</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #00000a;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }

    canvas { display: block; }

    /* ── HUD top-left ── */
    #hud {
      position: fixed;
      top: 28px;
      left: 32px;
      z-index: 10;
      pointer-events: none;
      user-select: none;
    }
    #hud h1 {
      font-size: clamp(1.6rem, 3.5vw, 2.6rem);
      letter-spacing: 0.5em;
      font-weight: 700;
      color: #00ffc8;
      text-shadow: 0 0 24px #00ffc8cc, 0 0 60px #00ffc840;
      line-height: 1;
    }
    #hud p {
      margin-top: 7px;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      color: #00ffc855;
    }

    /* ── Timer top-right ── */
    #timer {
      position: fixed;
      top: 28px;
      right: 32px;
      z-index: 10;
      pointer-events: none;
      text-align: right;
      user-select: none;
    }
    #timer .label {
      font-size: 0.58rem;
      letter-spacing: 0.25em;
      color: #00ffc844;
    }
    #timer .val {
      font-size: 1.3rem;
      letter-spacing: 0.1em;
      color: #00ffc8bb;
      text-shadow: 0 0 14px #00ffc877;
    }

    /* ── Controls panel ── */
    #panel {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      z-index: 10;
      background: rgba(0,255,200,0.03);
      border: 1px solid rgba(0,255,200,0.14);
      border-radius: 3px;
      padding: 14px 22px 12px;
      backdrop-filter: blur(8px);
    }

    .ctrl {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .ctrl label {
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: #00ffc866;
    }
    .ctrl output {
      font-size: 0.7rem;
      color: #00ffc8cc;
      min-width: 4ch;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 96px;
      height: 1px;
      background: rgba(0,255,200,0.25);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: #00ffc8;
      border-radius: 50%;
      box-shadow: 0 0 10px #00ffc8, 0 0 22px #00ffc855;
      cursor: pointer;
    }
    input[type="range"]::-moz-range-thumb {
      width: 10px;
      height: 10px;
      background: #00ffc8;
      border-radius: 50%;
      border: none;
      box-shadow: 0 0 10px #00ffc8;
      cursor: pointer;
    }

    /* ── Subtle scanlines ── */
    #scan {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,0,0,0.12) 3px,
        rgba(0,0,0,0.12) 4px
      );
    }

    /* ── hint ── */
    #hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.52rem;
      letter-spacing: 0.2em;
      color: rgba(0,255,200,0.25);
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="hud">
  <h1>VERTEX</h1>
  <p>SHADER — PUNTOS PULSANTES</p>
</div>

<div id="timer">
  <div class="label">TIEMPO</div>
  <div class="val" id="tval">0.00</div>
</div>

<div id="panel">
  <div class="ctrl">
    <label>PULSO</label>
    <input type="range" id="sPulse" min="0" max="4" step="0.05" value="1">
    <output id="oPulse">1.00</output>
  </div>
  <div class="ctrl">
    <label>VELOCIDAD</label>
    <input type="range" id="sSpeed" min="0" max="3" step="0.05" value="1">
    <output id="oSpeed">1.00</output>
  </div>
  <div class="ctrl">
    <label>FRECUENCIA</label>
    <input type="range" id="sFreq" min="0.1" max="5" step="0.1" value="0.8">
    <output id="oFreq">0.80</output>
  </div>
  <div class="ctrl">
    <label>ESCALA Y</label>
    <input type="range" id="sWave" min="0.5" max="12" step="0.1" value="3">
    <output id="oWave">3.0</output>
  </div>
</div>

<div id="hint">ARRASTRA PARA ORBITAR · RUEDA PARA ZOOM</div>
<div id="scan"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Renderer ───────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ─── Scene / Camera ─────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
camera.position.set(0, 0, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping    = true;
controls.dampingFactor    = 0.06;
controls.autoRotate       = true;
controls.autoRotateSpeed  = 0.4;
controls.enablePan        = false;
controls.minDistance      = 1.0;
controls.maxDistance      = 10;

// ─── VERTEX SHADER — puntos que pulsan con el tiempo ────────────────────────
const vertexShader = `
  uniform float uTime;
  uniform float uPulse;
  uniform float uFreq;
  uniform float uWaveY;
  attribute float aSize;
  varying float vPulse;
  varying vec3  vPos;

  void main() {
    vec3 pos = position;
    float pulse = sin(uTime * uFreq + pos.y * uWaveY) * 0.04;
    pos *= (1.0 + pulse * uPulse);

    vPulse = clamp(pulse * uPulse * 20.0 + 0.5, 0.0, 1.5);
    vPos   = pos;

    vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
    gl_PointSize = aSize * (280.0 / -mvPos.z);
    gl_Position  = projectionMatrix * mvPos;
  }
`;

// ─── FRAGMENT SHADER ────────────────────────────────────────────────────────
const fragmentShader = `
  uniform float uTime;
  varying float vPulse;
  varying vec3  vPos;

  void main() {
    vec2  uv = gl_PointCoord - 0.5;
    float d  = length(uv);
    if (d > 0.5) discard;

    float core = 1.0 - smoothstep(0.0,  0.15, d);
    float glow = 1.0 - smoothstep(0.0,  0.5,  d);
    float rim  = 1.0 - smoothstep(0.32, 0.5,  d);

    // Slowly cycling palette: teal → purple → azure → teal
    float t  = uTime * 0.11;
    vec3  c1 = vec3(0.0,  1.0,  0.78);   // #00ffc8
    vec3  c2 = vec3(0.55, 0.0,  1.0 );   // violet
    vec3  c3 = vec3(0.0,  0.65, 1.0 );   // azure
    float ph = fract(t);
    vec3 col;
    if      (ph < 0.333) col = mix(c1, c2, ph / 0.333);
    else if (ph < 0.667) col = mix(c2, c3, (ph - 0.333) / 0.334);
    else                 col = mix(c3, c1, (ph - 0.667) / 0.333);

    // Pulse lifts brightness
    col += vPulse * 0.35 * vec3(0.3, 0.9, 1.0);
    col  = clamp(col, 0.0, 2.0);

    float alpha = rim * 0.5 + glow * 0.25 + core * 0.25;
    gl_FragColor = vec4(col, alpha);
  }
`;

// ─── Uniforms ────────────────────────────────────────────────────────────────
const uniforms = {
  uTime:  { value: 0.0 },
  uPulse: { value: 1.0 },
  uFreq:  { value: 0.8 },
  uWaveY: { value: 3.0 },
};

// ─── Build particle geometry ─────────────────────────────────────────────────
function buildSphere(N, rMin, rMax, sizeMin, sizeMax) {
  const geo  = new THREE.BufferGeometry();
  const pos  = new Float32Array(N * 3);
  const size = new Float32Array(N);

  for (let i = 0; i < N; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = rMin + Math.random() * (rMax - rMin);

    pos[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i * 3 + 2] = r * Math.cos(phi);

    size[i] = sizeMin + Math.random() * (sizeMax - sizeMin);
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos,  3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(size, 1));
  return geo;
}

function makeMat() {
  return new THREE.ShaderMaterial({
    vertexShader,
    fragmentShader,
    uniforms,
    transparent: true,
    depthWrite:  false,
    blending:    THREE.AdditiveBlending,
  });
}

// Shell layer
const shell = new THREE.Points(buildSphere(28000, 0.88, 1.18, 0.35, 2.0), makeMat());
scene.add(shell);

// Inner nebula
const inner = new THREE.Points(buildSphere(7000, 0.0, 0.55, 0.2, 1.0), makeMat());
scene.add(inner);

// Sparse outer haze
const haze  = new THREE.Points(buildSphere(5000, 1.25, 2.2, 0.15, 0.7), makeMat());
scene.add(haze);

// ─── UI bindings ─────────────────────────────────────────────────────────────
function bindSlider(id, outId, key, fmt) {
  const el  = document.getElementById(id);
  const out = document.getElementById(outId);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    if (key) uniforms[key].value = v;
    out.textContent = fmt ? fmt(v) : v.toFixed(2);
  });
}

bindSlider('sPulse', 'oPulse', 'uPulse');
bindSlider('sSpeed', 'oSpeed', null);             // speed used in loop
bindSlider('sFreq',  'oFreq',  'uFreq');
bindSlider('sWave',  'oWave',  'uWaveY', v => v.toFixed(1));

// ─── Resize ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

// ─── Animation loop ──────────────────────────────────────────────────────────
const clock    = new THREE.Clock();
const tvalEl   = document.getElementById('tval');
const sSpeed   = document.getElementById('sSpeed');
let   elapsed  = 0;

function animate() {
  requestAnimationFrame(animate);

  const dt    = clock.getDelta();
  const speed = parseFloat(sSpeed.value);
  elapsed    += dt * speed;

  uniforms.uTime.value = elapsed;
  tvalEl.textContent   = elapsed.toFixed(2);

  controls.update();
  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>

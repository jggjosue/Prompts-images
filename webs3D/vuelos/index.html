<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rutas de Vuelo</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000510;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    canvas { display: block; }

    /* ── UI overlay ── */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* title */
    #title {
      position: absolute;
      top: 28px;
      left: 32px;
    }
    #title h1 {
      font-size: 1.3rem;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,.92);
    }
    #title p {
      margin-top: 4px;
      font-size: .65rem;
      letter-spacing: 3px;
      color: rgba(80,180,255,.7);
      text-transform: uppercase;
    }

    /* stats badge */
    #stats {
      position: absolute;
      top: 28px;
      right: 32px;
      text-align: right;
    }
    #stats .num {
      font-size: 2rem;
      font-weight: 200;
      color: rgba(80,200,255,.9);
      line-height: 1;
    }
    #stats .lbl {
      font-size: .6rem;
      letter-spacing: 2px;
      color: rgba(255,255,255,.4);
      text-transform: uppercase;
    }

    /* route legend */
    #legend {
      position: absolute;
      bottom: 28px;
      left: 32px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .leg-item {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: .7rem;
      color: rgba(255,255,255,.65);
      letter-spacing: .5px;
    }
    .leg-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor;
    }

    /* controls hint */
    #hint {
      position: absolute;
      bottom: 28px;
      right: 32px;
      text-align: right;
      font-size: .6rem;
      color: rgba(255,255,255,.28);
      letter-spacing: 1px;
      line-height: 1.8;
    }

    /* scan-line vignette */
    #vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="vignette"></div>

<div id="hud">
  <div id="title">
    <h1>Rutas de Vuelo</h1>
    <p>Global Flight Routes · Three.js</p>
  </div>

  <div id="stats">
    <div class="num" id="activeCount">0</div>
    <div class="lbl">Rutas activas</div>
  </div>

  <div id="legend"></div>

  <div id="hint">
    Arrastrar · rotar<br>
    Scroll · zoom<br>
    Doble clic · auto-rotar
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ════════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════════ */
const GLOBE_R   = 1.0;
const ARC_H     = 1.38;   // lift factor for arc midpoint
const SPEED     = 0.0014; // base particle speed (progress/frame)
const TAIL_LEN  = 18;     // number of tail segments

/* ════════════════════════════════════════════
   SCENE / CAMERA / RENDERER
════════════════════════════════════════════ */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0, 0.6, 3.6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000510, 1);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.dampingFactor   = 0.06;
controls.minDistance     = 1.8;
controls.maxDistance     = 9;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.25;
renderer.domElement.addEventListener('dblclick', () => {
  controls.autoRotate = !controls.autoRotate;
});

/* ════════════════════════════════════════════
   STARS
════════════════════════════════════════════ */
(function buildStars() {
  const count = 4000;
  const pos   = new Float32Array(count * 3);
  const sizes = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    const r = 60 + Math.random() * 40;
    const u = Math.random(), v = Math.random();
    const phi   = Math.acos(2 * u - 1);
    const theta = 2 * Math.PI * v;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.cos(phi);
    pos[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    sizes[i]   = 0.4 + Math.random() * 1.2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,   3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff, size: 0.07,
    sizeAttenuation: true, transparent: true, opacity: 0.75
  });
  scene.add(new THREE.Points(geo, mat));
})();

/* ════════════════════════════════════════════
   GLOBE TEXTURE (procedural canvas)
════════════════════════════════════════════ */
function buildGlobeTexture() {
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const cx = cv.getContext('2d');

  // ocean
  cx.fillStyle = '#030e1e';
  cx.fillRect(0, 0, W, H);

  // latitude grid
  cx.strokeStyle = 'rgba(30,100,180,0.18)';
  cx.lineWidth = 0.8;
  for (let lat = -80; lat <= 80; lat += 15) {
    const y = (1 - (lat + 90) / 180) * H;
    cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke();
  }
  for (let lon = 0; lon < 360; lon += 15) {
    const x = lon / 360 * W;
    cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke();
  }

  // landmass helper
  function land(paths) {
    cx.fillStyle = '#0e2e1a';
    paths.forEach(p => { cx.beginPath(); p(); cx.fill(); });
  }
  function dot(x, y, rx, ry, rot = 0) {
    cx.save(); cx.translate(x, y); cx.rotate(rot);
    cx.scale(1, ry / rx);
    cx.arc(0, 0, rx, 0, Math.PI * 2); cx.restore();
  }

  // approximate continents (equirectangular)
  // lon→x: (lon+180)/360*W   lat→y: (90-lat)/180*H
  const lx = (lon) => (lon + 180) / 360 * W;
  const ly = (lat) => (90 - lat) / 180 * H;

  // North America
  land([
    () => {
      cx.moveTo(lx(-138), ly(60)); cx.lineTo(lx(-60), ly(60));
      cx.lineTo(lx(-55),  ly(45)); cx.lineTo(lx(-68), ly(25));
      cx.lineTo(lx(-90),  ly(15)); cx.lineTo(lx(-120),ly(15));
      cx.lineTo(lx(-138), ly(35)); cx.closePath();
    }
  ]);
  // Greenland
  land([() => dot(lx(-42), ly(73), 55, 80)]);
  // South America
  land([
    () => {
      cx.moveTo(lx(-80), ly(10));  cx.lineTo(lx(-50), ly(10));
      cx.lineTo(lx(-35), ly(-5));  cx.lineTo(lx(-35), ly(-35));
      cx.lineTo(lx(-55), ly(-55)); cx.lineTo(lx(-75), ly(-40));
      cx.lineTo(lx(-80), ly(-15)); cx.closePath();
    }
  ]);
  // Europe
  land([
    () => {
      cx.moveTo(lx(-10), ly(36)); cx.lineTo(lx(40),  ly(36));
      cx.lineTo(lx(40),  ly(60)); cx.lineTo(lx(25),  ly(70));
      cx.lineTo(lx(-5),  ly(60)); cx.closePath();
    }
  ]);
  // Scandinavia
  land([() => dot(lx(15), ly(63), 20, 55)]);
  // Africa
  land([
    () => {
      cx.moveTo(lx(-18), ly(35)); cx.lineTo(lx(52),  ly(35));
      cx.lineTo(lx(52),  ly(10)); cx.lineTo(lx(42),  ly(-5));
      cx.lineTo(lx(35),  ly(-35));cx.lineTo(lx(18),  ly(-35));
      cx.lineTo(lx(10),  ly(-10));cx.lineTo(lx(-18), ly(5));
      cx.closePath();
    }
  ]);
  // Asia
  land([
    () => {
      cx.moveTo(lx(26),  ly(68)); cx.lineTo(lx(190), ly(70));
      cx.lineTo(lx(145), ly(40)); cx.lineTo(lx(130), ly(30));
      cx.lineTo(lx(100), ly(0));  cx.lineTo(lx(60),  ly(20));
      cx.lineTo(lx(40),  ly(36)); cx.lineTo(lx(26),  ly(42));
      cx.closePath();
    }
  ]);
  // India
  land([() => dot(lx(80), ly(20), 28, 42)]);
  // Japan
  land([() => dot(lx(137), ly(36), 8, 20, 0.5)]);
  // Australia
  land([() => dot(lx(134), ly(-25), 65, 45)]);
  // New Zealand
  land([() => dot(lx(172), ly(-41), 5, 14)]);

  // subtle highlight on land
  const grad = cx.createRadialGradient(W*0.5, H*0.35, H*0.05, W*0.5, H*0.35, H*0.8);
  grad.addColorStop(0, 'rgba(30,80,30,0.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  cx.fillStyle = grad;
  cx.fillRect(0, 0, W, H);

  return new THREE.CanvasTexture(cv);
}

/* ════════════════════════════════════════════
   GLOBE MESH
════════════════════════════════════════════ */
const globeMesh = new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R, 80, 80),
  new THREE.MeshPhongMaterial({
    map: buildGlobeTexture(),
    specular: new THREE.Color(0x112244),
    shininess: 20,
  })
);
scene.add(globeMesh);

// atmosphere glow (inner)
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R * 1.018, 64, 64),
  new THREE.MeshPhongMaterial({
    color: 0x2266ff, transparent: true, opacity: 0.06,
    side: THREE.FrontSide, depthWrite: false
  })
));
// atmosphere glow (outer ring)
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(GLOBE_R * 1.06, 64, 64),
  new THREE.MeshPhongMaterial({
    color: 0x1144ff, transparent: true, opacity: 0.025,
    side: THREE.BackSide, depthWrite: false
  })
));

/* ════════════════════════════════════════════
   LIGHTS
════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x223355, 3));
const sun = new THREE.DirectionalLight(0xffeedd, 3.5);
sun.position.set(5, 3, 4);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x334466, 0.6);
fill.position.set(-4, -2, -4);
scene.add(fill);

/* ════════════════════════════════════════════
   COORDINATE HELPERS
════════════════════════════════════════════ */
function latLonToVec3(lat, lon, r = GLOBE_R) {
  const phi   = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
     r * Math.cos(phi),
     r * Math.sin(phi) * Math.sin(theta)
  );
}

/* ════════════════════════════════════════════
   ARC CREATION  ← the snippet from the image
════════════════════════════════════════════ */
function createArc(from, to, h = ARC_H) {
  const mid = from.clone().add(to).normalize()
    .multiplyScalar(GLOBE_R * h);
  return new THREE.CatmullRomCurve3([from, mid, to]);
}

/* ════════════════════════════════════════════
   ROUTE DATA  [lat, lon]
════════════════════════════════════════════ */
const ROUTES = [
  { from:[40.71,-74.01], to:[51.51,-0.13],   color:0x00d4ff, label:'Nueva York → Londres'     },
  { from:[35.68,139.69], to:[34.05,-118.24], color:0xff6b35, label:'Tokyo → Los Ángeles'       },
  { from:[48.86,2.35],   to:[25.20,55.27],   color:0xff69b4, label:'París → Dubái'             },
  { from:[19.43,-99.13], to:[40.71,-74.01],  color:0xffd700, label:'Ciudad de México → NYC'   },
  { from:[55.76,37.62],  to:[39.90,116.41],  color:0x00ff88, label:'Moscú → Pekín'            },
  { from:[-23.55,-46.63],to:[48.86,2.35],    color:0xff4444, label:'São Paulo → París'         },
  { from:[1.35,103.82],  to:[28.61,77.21],   color:0xaa88ff, label:'Singapur → Nueva Delhi'   },
  { from:[-33.87,151.21],to:[1.35,103.82],   color:0x66ffcc, label:'Sídney → Singapur'        },
  { from:[51.51,-0.13],  to:[35.68,139.69],  color:0xffaa00, label:'Londres → Tokyo'           },
  { from:[34.05,-118.24],to:[-33.87,151.21], color:0x88ff44, label:'Los Ángeles → Sídney'     },
  { from:[40.71,-74.01], to:[-23.55,-46.63], color:0xff88cc, label:'Nueva York → São Paulo'   },
  { from:[25.20,55.27],  to:[1.35,103.82],   color:0x44aaff, label:'Dubái → Singapur'         },
];

/* ════════════════════════════════════════════
   BUILD LEGEND
════════════════════════════════════════════ */
const legend = document.getElementById('legend');
ROUTES.forEach(r => {
  const hex = '#' + r.color.toString(16).padStart(6, '0');
  const el  = document.createElement('div');
  el.className = 'leg-item';
  el.innerHTML = `<div class="leg-dot" style="background:${hex};color:${hex}"></div><span>${r.label}</span>`;
  legend.appendChild(el);
});
document.getElementById('activeCount').textContent = ROUTES.length;

/* ════════════════════════════════════════════
   BUILD ARC OBJECTS
════════════════════════════════════════════ */
const arcObjects = [];

ROUTES.forEach((route, idx) => {
  const fromVec = latLonToVec3(...route.from);
  const toVec   = latLonToVec3(...route.to);
  const curve   = createArc(fromVec, toVec);

  // ── TubeGeometry (opacity 0.25) como línea guía ──
  const tubeGeo = new THREE.TubeGeometry(curve, 80, 0.0018, 6, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color: route.color,
    transparent: true,
    opacity: 0.25,
    depthWrite: false,
  });
  scene.add(new THREE.Mesh(tubeGeo, tubeMat));

  // endpoint dots
  [fromVec, toVec].forEach(v => {
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.009, 8, 8),
      new THREE.MeshBasicMaterial({ color: route.color })
    );
    dot.position.copy(v);
    scene.add(dot);
    // pulse ring
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.012, 0.018, 16),
      new THREE.MeshBasicMaterial({ color: route.color, transparent: true, opacity: 0.6, side: THREE.DoubleSide, depthWrite: false })
    );
    ring.position.copy(v);
    ring.lookAt(new THREE.Vector3(0, 0, 0));
    scene.add(ring);
  });

  // ── Partícula que viaja: progress cíclico 0→1 ──
  const particle = new THREE.Mesh(
    new THREE.SphereGeometry(0.014, 10, 10),
    new THREE.MeshBasicMaterial({ color: route.color })
  );
  scene.add(particle);

  // inner bright core
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(0.007, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  particle.add(core);

  // tail — array of small fading spheres
  const tail = [];
  for (let t = 0; t < TAIL_LEN; t++) {
    const tm = new THREE.Mesh(
      new THREE.SphereGeometry(0.013 * (1 - t / TAIL_LEN), 6, 6),
      new THREE.MeshBasicMaterial({
        color: route.color,
        transparent: true,
        opacity: 0.45 * (1 - t / TAIL_LEN),
        depthWrite: false,
      })
    );
    scene.add(tm);
    tail.push(tm);
  }

  arcObjects.push({
    curve,
    particle,
    tail,
    progress: idx / ROUTES.length,  // stagger start positions
    speed: SPEED * (0.8 + Math.random() * 0.5),
  });
});

/* ════════════════════════════════════════════
   ANIMATION LOOP
════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  arcObjects.forEach(obj => {
    // advance progress cyclically 0 → 1
    obj.progress = (obj.progress + obj.speed) % 1;

    const pos = obj.curve.getPoint(obj.progress);
    obj.particle.position.copy(pos);

    // tail positions sampled behind current progress
    obj.tail.forEach((tm, i) => {
      const tp = ((obj.progress - (i + 1) * 0.012 + 1) % 1);
      tm.position.copy(obj.curve.getPoint(tp));
    });
  });

  controls.update();
  renderer.render(scene, camera);
}
animate();

/* ════════════════════════════════════════════
   RESIZE
════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

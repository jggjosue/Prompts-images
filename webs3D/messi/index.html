<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lionel Messi — Magia Infinita</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a84c;
    --gold-light: #f0d060;
    --celeste: #6ab0e6;
    --celeste-light: #87ceeb;
    --white: #f5f5f5;
    --black: #0a0a0a;
    --dark: #0d0d0d;
    --gray: #1a1a1a;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--black);
    color: var(--white);
    overflow-x: hidden;
    min-height: 200vh;
  }

  /* ── Preloader ── */
  #preloader {
    position: fixed; inset: 0;
    background: var(--black);
    display: flex; align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #preloader.done { opacity: 0; visibility: hidden; pointer-events: none; }
  #preloader::after {
    content: '';
    width: 40px; height: 40px;
    border: 2px solid rgba(201,168,76,0.15);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Nav ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 24px 48px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 100;
    opacity: 0; transform: translateY(-20px);
    transition: opacity 0.6s ease, transform 0.6s ease, background 0.4s ease;
    pointer-events: none;
  }
  nav.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  nav.scrolled {
    background: rgba(10,10,10,0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 48px;
  }
  nav .logo {
    font-size: 14px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: var(--gold);
  }
  nav ul { display: flex; gap: 32px; list-style: none; }
  nav ul a {
    color: rgba(245,245,245,0.6);
    text-decoration: none; font-size: 12px; letter-spacing: 2px;
    text-transform: uppercase; transition: color 0.3s;
    font-weight: 500;
  }
  nav ul a:hover { color: var(--gold); }

  /* ── Canvas bg (particles) ── */
  #particles-canvas {
    position: fixed; inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* ── Hero ── */
  .hero {
    position: relative; z-index: 2;
    width: 100%; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--black);
    overflow: hidden;
  }

  .hero-bg {
    position: absolute; inset: 0;
    z-index: 1;
    transition: opacity 1.2s cubic-bezier(0.77, 0, 0.18, 1);
  }
  .hero-bg--image {
    opacity: 1;
  }
  .hero-bg--image img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 30%;
  }
  .hero-bg--video {
    opacity: 0;
  }
  .hero-bg--video video {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .hero.active .hero-bg--image { opacity: 0; }
  .hero.active .hero-bg--video { opacity: 1; }

  /* Subtle overlay so text remains readable */
  .hero::after {
    content: '';
    position: absolute; inset: 0;
    z-index: 2;
    background:
      linear-gradient(to right, rgba(10,10,10,0.5) 0%, transparent 25%, transparent 75%, rgba(10,10,10,0.5) 100%),
      linear-gradient(to top, rgba(10,10,10,0.4) 0%, transparent 35%);
    pointer-events: none;
  }

  /* Left text */
  .hero-left {
    position: absolute; left: 48px;
    z-index: 10;
    pointer-events: none;
  }
  .hero-left h1 {
    font-size: clamp(32px, 5.5vw, 82px);
    font-weight: 800; line-height: 0.95;
    letter-spacing: -2px;
    text-transform: uppercase;
    color: var(--white);
    text-shadow: 0 0 60px rgba(201,168,76,0.1);
  }
  .hero-left h1 .num10 {
    display: block;
    font-size: clamp(60px, 8vw, 120px);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-top: 4px;
  }

  /* Right text */
  .hero-right {
    position: absolute; right: 48px;
    z-index: 10; text-align: right;
    max-width: 260px;
    pointer-events: none;
  }
  .hero-right .tagline {
    font-size: clamp(18px, 2vw, 28px);
    font-weight: 700; letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--gold-light), var(--celeste-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero-right p {
    font-size: clamp(11px, 1vw, 13px);
    color: rgba(245,245,245,0.4);
    line-height: 1.7;
    letter-spacing: 0.5px;
  }

  /* (media-container replaced by hero-bg above) */

  /* ── Bottom CTAs ── */
  .ctas {
    position: absolute; bottom: 48px;
    left: 48px; right: 48px;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  .ctas .left, .ctas .right { display: flex; gap: 16px; }

  .btn {
    padding: 12px 28px;
    border-radius: 50px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
  }
  .btn-ghost {
    border: 1.5px solid var(--gold);
    color: var(--gold);
    background: transparent;
  }
  .btn-ghost:hover {
    background: rgba(201,168,76,0.1);
    box-shadow: 0 0 30px rgba(201,168,76,0.2);
  }
  .btn-solid {
    border: 1.5px solid var(--celeste);
    background: var(--celeste);
    color: var(--white);
  }
  .btn-solid:hover {
    background: var(--celeste-light);
    border-color: var(--celeste-light);
    box-shadow: 0 0 30px rgba(106,176,230,0.3);
  }

  /* ── Scroll indicator ── */
  .scroll-indicator {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex; flex-direction: column; align-items: center;
    gap: 8px;
    opacity: 1;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  .scroll-indicator.hidden { opacity: 0; }
  .scroll-indicator span {
    font-size: 10px; letter-spacing: 3px;
    text-transform: uppercase;
    color: rgba(245,245,245,0.3);
  }
  .scroll-line {
    width: 1px; height: 40px;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollPulse 2s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%, 100% { opacity: 0.3; transform: scaleY(0.6); }
    50% { opacity: 1; transform: scaleY(1); }
  }

  /* ── Subtle grain overlay ── */
  .grain {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    nav { padding: 16px 20px; }
    nav ul { gap: 16px; }
    nav ul a { font-size: 10px; letter-spacing: 1px; }
    .hero-left { left: 20px; }
    .hero-left h1 { font-size: clamp(24px, 7vw, 36px); letter-spacing: -1px; }
    .hero-left h1 .num10 { font-size: clamp(40px, 12vw, 60px); }
    .hero-right { display: none; }
    .ctas { left: 20px; right: 20px; bottom: 28px; flex-direction: column; gap: 12px; }
    .ctas .left, .ctas .right { width: 100%; }
    .ctas .btn { flex: 1; text-align: center; }
    .media-container { width: 90vw; height: 50vw; }
    .scroll-indicator { bottom: 80px; }
  }

  @media (max-width: 480px) {
    .hero-left h1 { font-size: 20px; }
    .hero-left h1 .num10 { font-size: 36px; }
    .btn { padding: 10px 18px; font-size: 10px; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Preloader -->
<div id="preloader"></div>

<!-- Background noise -->
<div class="grain"></div>

<!-- Particles canvas -->
<canvas id="particles-canvas"></canvas>

<!-- Navigation -->
<nav id="navbar">
  <div class="logo">Messi</div>
  <ul>
    <li><a href="#">Inicio</a></li>
    <li><a href="#">Trayectoria</a></li>
    <li><a href="#">Legado</a></li>
    <li><a href="#">Galería</a></li>
  </ul>
</nav>

<!-- Hero -->
<section class="hero" id="hero">
  <div class="hero-left">
    <h1>
      Lionel<br>
      Messi
      <span class="num10">10</span>
    </h1>
  </div>

  <div class="hero-right">
    <div class="tagline">Magia Infinita</div>
    <p>Visión de juego, control absoluto y una conexión única con el balón que trasciende el deporte. Bienvenido al universo del genio.</p>
  </div>

  <div class="hero-bg hero-bg--image" id="posterBg">
    <img src="images/Messi_dribbling_with_golden_aura_202606091537_4.jpeg" alt="Messi" />
  </div>
  <div class="hero-bg hero-bg--video" id="videoBg">
    <video
      id="heroVideo"
      src="messi_ad_4k_60fps.mp4"
      muted
      loop
      playsinline
      preload="auto"
    ></video>
  </div>

  <div class="scroll-indicator" id="scrollIndicator">
    <span>Descubre</span>
    <div class="scroll-line"></div>
  </div>

  <div class="ctas">
    <div class="left">
      <a href="#" class="btn btn-ghost">Explorar</a>
    </div>
    <div class="right">
      <a href="#" class="btn btn-solid">Ver Más</a>
    </div>
  </div>
</section>

<script>
// ── Preloader ──
window.addEventListener('load', () => {
  document.getElementById('preloader').classList.add('done');
});

// ── Particles ──
const canvas = document.getElementById('particles-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouseX = 0, mouseY = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() {
    this.reset();
  }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2.5 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.5 + 0.1;
    this.hue = Math.random() > 0.6
      ? 45 + Math.random() * 15  // gold tones
      : 200 + Math.random() * 20; // celeste tones
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x < 0 || this.x > canvas.width ||
        this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
    // Mouse interaction - subtle attraction
    const dx = mouseX - this.x;
    const dy = mouseY - this.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 200) {
      const force = (200 - dist) / 200 * 0.02;
      this.x += dx * force;
      this.y += dy * force;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    const isGold = this.hue > 100;
    if (isGold) {
      ctx.fillStyle = `rgba(201, 168, 76, ${this.opacity})`;
      ctx.shadowColor = 'rgba(201, 168, 76, 0.3)';
    } else {
      ctx.fillStyle = `rgba(106, 176, 230, ${this.opacity})`;
      ctx.shadowColor = 'rgba(106, 176, 230, 0.2)';
    }
    ctx.shadowBlur = this.size * 4;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function initParticles(count) {
  particles = [];
  for (let i = 0; i < count; i++) {
    particles.push(new Particle());
  }
}
initParticles(120);

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

document.addEventListener('mousemove', (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

// ── Scroll transition ──
const hero = document.getElementById('hero');
const video = document.getElementById('heroVideo');
const nav = document.getElementById('navbar');
const scrollIndicator = document.getElementById('scrollIndicator');
let hasScrolled = false;
let videoPlayStarted = false;

window.addEventListener('scroll', () => {
  const scrollY = window.scrollY;

  // At ~50px scroll, trigger the transition
  if (scrollY > 50 && !hasScrolled) {
    hasScrolled = true;
    hero.classList.add('active');

    // Start video on user interaction (browser policy)
    if (!videoPlayStarted) {
      video.play().catch(() => {});
      videoPlayStarted = true;
    }

    // Hide scroll indicator
    scrollIndicator.classList.add('hidden');

    // Show nav
    nav.classList.add('visible');
  }

  // Nav background on deeper scroll
  if (scrollY > 150) {
    nav.classList.add('scrolled');
  } else {
    nav.classList.remove('scrolled');
  }
});

// ── Ensure video plays on first user interaction ──
const startVideo = () => {
  if (!videoPlayStarted) {
    video.play().catch(() => {});
    videoPlayStarted = true;
  }
  document.removeEventListener('touchstart', startVideo);
  document.removeEventListener('click', startVideo);
};
document.addEventListener('touchstart', startVideo);
document.addEventListener('click', startVideo);

// ── Smooth scroll for "Descubre" ──
document.querySelector('.scroll-indicator').addEventListener('click', () => {
  window.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
});

// ── Handle font loading ──
document.fonts.ready.then(() => {
  document.body.style.visibility = 'visible';
});
</script>
</body>
</html>
